[settings]
quiet = true
experimental = true

[settings.task]
output = "interleave"

[settings.aqua]
registries = ["https://github.com/KnickKnackLabs/bats-core"]

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
"aqua:shenwei356/rush" = "0.11"
uv = "0.13"
ruff = "0.17"

# Knick Knack Labs
"aqua:KnickKnackLabs/bats-core" = "1.14.0-kkl.3"
"shiv:codebase" = "0.5"
"shiv:readme" = "0.3"

[_.codebase]
name = "sms"
lint = ["@all"]

[env]
PYTHONPATH = "{{config_root}}/lib"
